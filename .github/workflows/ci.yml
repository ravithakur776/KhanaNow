name: KhanaNow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Server Type Check
        working-directory: ./server
        run: npx tsc --noEmit

      - name: Run Backend Test Suite
        working-directory: ./server
        run: npx tsx src/utils/production.test.ts
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/khananow_test
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_12345
          RAZORPAY_KEY_SECRET: test_razorpay_secret

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Client Type Check & Production Build
        working-directory: ./client
        run: npm run build
