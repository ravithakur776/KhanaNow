name: KhanaNow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Server Type Check
        working-directory: ./server
        run: npm run typecheck

      - name: Server ESLint
        working-directory: ./server
        run: npm run lint

      - name: Run Backend Test Suite
        working-directory: ./server
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/khananow_test
          JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_pipeline_12345
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_pipeline_67890
          RAZORPAY_KEY_ID: rzp_test_ci_mock_id
          RAZORPAY_KEY_SECRET: test_razorpay_secret_key_ci
          RAZORPAY_WEBHOOK_SECRET: test_razorpay_webhook_secret_ci

      - name: Server Production Build
        working-directory: ./server
        run: npm run build

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Client Type Check
        working-directory: ./client
        run: npm run typecheck

      - name: Client ESLint
        working-directory: ./client
        run: npm run lint

      - name: Client Production Build
        working-directory: ./client
        run: npm run build
